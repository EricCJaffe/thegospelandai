<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="#1E3A5F" stroke-width="1" opacity="0.35">
    <!-- Vertical lines -->
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
    <!-- Horizontal lines -->
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
  </g>

  <!-- Eyebrow text -->
  <text
    x="600"
    y="222"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="3"
    fill="#94A3B8"
    text-anchor="middle"
    text-transform="uppercase"
  >A CHRISTIAN GUIDE TO THRIVING IN THE AGE OF AI</text>

  <!-- Main title -->
  <text
    x="600"
    y="338"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="88"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
  >Anchored in the Storm</text>

  <!-- Domain -->
  <text
    x="600"
    y="520"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#CBD5E1"
    text-anchor="middle"
  >thegospelandai.com</text>
</svg>
