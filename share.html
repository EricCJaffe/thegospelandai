<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>A shared answer — The Gospel and AI</title>
<meta property="og:title" content="A shared answer from Anchored, the Gospel and AI companion">
<meta property="og:description" content="Scripture-grounded answers on faith in the age of AI, from the book Anchored in the Storm.">
<meta property="og:image" content="https://thegospelandai.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0F172A; color: #E2E8F0; min-height: 100vh; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  .brand { font-size: 13px; letter-spacing: 3px; color: #94A3B8; text-transform: uppercase; margin-bottom: 28px; }
  .brand a { color: inherit; text-decoration: none; }
  .q { font-size: 22px; font-weight: 600; color: #fff; line-height: 1.35; margin-bottom: 20px; }
  .sender { color: #A78BFA; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .a p { line-height: 1.65; margin-bottom: 14px; color: #CBD5E1; }
  .res { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
  .res a { display: block; background: #1E293B; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; color: #E2E8F0; text-decoration: none; font-size: 14px; }
  .res a:hover { border-color: #3B82F6; }
  .cta { display: inline-block; margin-top: 32px; background: #3B82F6; color: #fff; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: 500; }
  .err { color: #94A3B8; }
</style>
</head>
<body>
<main>
  <p class="brand"><a href="/">The Gospel and AI</a></p>
  <div id="content"><p class="err">Loading…</p></div>
  <a class="cta" href="/#chat-form">Ask your own question</a>
</main>
<script>
  (function () {
    var box = document.getElementById('content');
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function safeUrl(u) { try { var p = new URL(u); return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : '#'; } catch (e) { return '#'; } }
    var s = new URLSearchParams(location.search).get('s') || '';
    fetch('/api/share?s=' + encodeURIComponent(s))
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { box.innerHTML = '<p class="err">' + esc(x.d.error || 'This link is not valid.') + '</p>'; return; }
        var d = x.d;
        box.innerHTML =
          '<h1 class="q">' + esc(d.question) + '</h1>' +
          '<p class="sender">Anchored:</p>' +
          '<div class="a">' + String(d.answer || '').split(/\n\n+/).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' +
          (d.resources && d.resources.length ? '<div class="res">' + d.resources.map(function (r) {
            return '<a href="' + esc(safeUrl(r.url)) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a>';
          }).join('') + '</div>' : '');
      })
      .catch(function () { box.innerHTML = '<p class="err">Something went wrong loading this answer.</p>'; });
  })();
</script>
</body>
</html>
